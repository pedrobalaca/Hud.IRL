
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUD IRL - Natal</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

.hud {
  width: 300px;
  padding: 7px;
  color: white;
  background: rgba(0, 0, 0, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
}

.row {
  display: flex;
  align-items: center;
  min-height: 52px;
  padding: 5px 8px;
  margin: 3px 0;
  background: rgba(0, 0, 0, 0.22);
  border-radius: 5px;
}

.icon {
  width: 48px;
  text-align: center;
  font-size: 27px;
  line-height: 1;
  margin-right: 7px;
}

.info {
  border-left: 2px solid rgba(255, 255, 255, 0.18);
  padding-left: 10px;
}

.value {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 0.5px;
}

.label {
  margin-top: 3px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  opacity: 0.55;
}
</style>
</head>

<body>

<div class="hud">

  <div class="row">
    <div class="icon" id="weatherIcon">☀️</div>
    <div class="info">
      <div class="value" id="temperature">--°C</div>
      <div class="label">TEMPERATURA</div>
    </div>
  </div>

  <div class="row">
    <div class="icon">🕐</div>
    <div class="info">
      <div class="value" id="time">--:--:--</div>
      <div class="label">HORÁRIO</div>
    </div>
  </div>

  <div class="row">
    <div class="icon">📅</div>
    <div class="info">
      <div class="value" id="date">--/--/----</div>
      <div class="label" id="weekday">DATA</div>
    </div>
  </div>

</div>

<script>

const LAT = -5.7950;
const LON = -35.2094;

const weatherIcons = {
  0: "☀️",
  1: "🌤️",
  2: "⛅",
  3: "☁️",
  45: "🌫️",
  48: "🌫️",
  51: "🌦️",
  53: "🌦️",
  55: "🌧️",
  56: "🌧️",
  57: "🌧️",
  61: "🌧️",
  63: "🌧️",
  65: "🌧️",
  66: "🌧️",
  67: "🌧️",
  71: "🌨️",
  73: "🌨️",
  75: "❄️",
  77: "🌨️",
  80: "🌦️",
  81: "🌧️",
  82: "⛈️",
  85: "🌨️",
  86: "🌨️",
  95: "⛈️",
  96: "⛈️",
  99: "⛈️"
};

function updateClock() {

  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("pt-BR", {
      timeZone: "America/Fortaleza",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("pt-BR", {
      timeZone: "America/Fortaleza",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });

  document.getElementById("weekday").textContent =
    now.toLocaleDateString("pt-BR", {
      timeZone: "America/Fortaleza",
      weekday: "long"
    }).toUpperCase();
}

async function updateWeather() {

  try {

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + LAT +
      "&longitude=" + LON +
      "&current=temperature_2m,weather_code" +
      "&timezone=America%2FFortaleza";

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Falha na API");
    }

    const data = await response.json();

    const temp =
      Math.round(data.current.temperature_2m);

    const code =
      data.current.weather_code;

    document.getElementById("temperature").textContent =
      temp + "°C";

    document.getElementById("weatherIcon").textContent =
      weatherIcons[code] || "🌡️";

  } catch (error) {

    document.getElementById("temperature").textContent =
      "--°C";

    document.getElementById("weatherIcon").textContent =
      "🌡️";
  }
}

updateClock();
updateWeather();

setInterval(updateClock, 1000);

setInterval(updateWeather, 600000);

</script>

</body>
</html>
